services:
  - type: web
    name: curebot-whatsapp
    runtime: node
    plan: starter          # לא free — שירות חינמי נכבה והחיבור לוואטסאפ נופל
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: curebot-auth   # שומר את כל החיבורים והקודים בין הפעלות מחדש
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: OWNER_NUMBER
        value: "972543032349"
      - key: PANEL_KEY
        sync: false        # קוד המנהלת
      - key: OPENAI_API_KEY
        sync: false        # אופציונלי: תשובות זורמות + תמלול קולי
      - key: STT_MODEL
        value: whisper-1
