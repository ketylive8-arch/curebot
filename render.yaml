# שכפול לעסק אחר: ב-Render -> New -> Blueprint -> לבחור את הריפו. כל השדות מוגדרים כאן.
# שדות עם sync:false מוזנים פעם אחת בלוח הבקרה של Render (סודות, לא נשמרים בקוד).
services:
  - type: web
    name: curebot-agent
    runtime: node
    plan: free            # להפעלה אמיתית מומלץ starter: בחינם השרת נרדם אחרי 15 דקות בלי פניות
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY      # המוח
        sync: false
      - key: ADMIN_KEY              # מפתח ללוח הבקרה ולדמו
        generateValue: true
      - key: META_VERIFY_TOKEN      # מודבק גם בהגדרות ה-webhook ב-Meta
        generateValue: true
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: OWNER_NUMBER           # מספר הבעלים להתראות, בפורמט 9725XXXXXXXX
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL     # זיכרון קבוע (מומלץ). בלעדיו הזיכרון מתאפס בכל הפעלה מחדש
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: OPENAI_API_KEY             # אופציונלי: תמלול הודעות קוליות
        sync: false
